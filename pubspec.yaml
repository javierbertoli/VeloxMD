name: veloxmd
description: A fast Markdown viewer for Linux desktop.
publish_to: 'none'

version: 1.0.11+18

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.5
  file_picker: ^8.1.7
  window_manager: ^0.3.9
  url_launcher: ^6.3.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  markdown: ^7.2.2
  desktop_drop: ^0.4.4
  scroll_to_index: ^3.0.1
  webview_cef: ^0.6.1
  http: ^1.2.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mermaid.min.js
    - assets/fonts/OFL-OpenDyslexic.txt
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
          weight: 400
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
        - asset: assets/fonts/OpenDyslexic-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/OpenDyslexic-Bold-Italic.otf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
          weight: 400
